# Measures a data source before any pipeline change is made.
#
# Deliberately manual only (workflow_dispatch, no schedule): this job exists to produce
# the numbers that ADR 0001 currently estimates. It is read-only — it fetches, measures,
# and writes a job summary. It commits nothing and touches no storage.
#
# See 04_documents/open-questions.md (OQ-1).

name: Measure source

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Source endpoint to profile"
        required: true
        type: string
      keep_columns:
        description: "Comma-separated column subset (sizes the slim model layer)"
        required: false
        type: string
        default: ""
      top:
        description: "How many of the widest columns to list"
        required: false
        type: string
        default: "25"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Show runner resources
        run: |
          echo "CPU cores : $(nproc)"
          echo "Memory    : $(free -h | awk '/^Mem:/ {print $2}')"
          echo "Disk free : $(df -h --output=avail / | tail -1)"

      - name: Measure source
        run: |
          uv run python scripts/measure_source.py \
            --url "${{ inputs.url }}" \
            --keep-columns "${{ inputs.keep_columns }}" \
            --top "${{ inputs.top }}"
